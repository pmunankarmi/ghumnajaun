name: Publish WordPress theme
on:
  push:
    branches: [main]
    paths: ['wordpress/ghumnajaun/**', 'design/**', 'tools/build-design-runtime.cjs', '.github/workflows/theme-release.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: theme-release
  cancel-in-progress: false
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build original design assets
        run: node tools/build-design-runtime.cjs
      - name: Validate PHP
        run: find wordpress/ghumnajaun -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Validate browser interactions
        run: node --check wordpress/ghumnajaun/assets/theme.js
      - name: Package theme
        env:
          BUILD: ${{ github.run_number }}
        run: |
          mkdir -p dist/ghumnajaun
          cp -R wordpress/ghumnajaun/. dist/ghumnajaun/
          VERSION="1.1.${BUILD}"
          sed -i "s/^Version:.*/Version: ${VERSION}/" dist/ghumnajaun/style.css
          printf '%s\n' "$VERSION" > dist/version.txt
          cd dist
          zip -rq ghumnajaun.zip ghumnajaun
          printf '{"version":"%s","package":"https://github.com/pmunankarmi/ghumnajaun/releases/download/v%s/ghumnajaun.zip"}\n' "$VERSION" "$VERSION" > ghumnajaun-update.json
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(cat dist/version.txt)
          gh release create "v${VERSION}" dist/ghumnajaun.zip dist/ghumnajaun-update.json --title "Ghumna Jaun ${VERSION}" --notes "Automatic theme build from ${GITHUB_SHA}. Admin content is preserved." --latest
