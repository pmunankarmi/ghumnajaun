        <div class="trip-card">
          <h3>Picnics and access</h3>
          <ul class="trip-visit-list">
            <li>Pack prepared food for the rest shelters. Cooking and open fires are prohibited.</li>
            <li>For a visit with kids, plan short garden loops with breaks at the shelters.</li>
            <li>Some paths are wheelchair accessible. Ask at the gate about suitable routes and the electric shuttle.</li>
          </ul>
          <div class="trip-text-links">

          <div><h3>By bus</h3><p>Sajha Yatayat’s Ratnapark–Godawari route stops at Lagankhel and Satdobato. From Godawari Bus Park, continue on foot to the garden entrance.</p><a href="https://sajhayatayat.com.np/short-routes/" target="_blank" rel="noopener">Sajha Yatayat routes <span class="link-arrow" aria-hidden="true">↗</span></a></div>
          <div><h3>By car or taxi</h3><p>Set directions to the main entrance. Paid parking is available outside the gate.</p></div>
          <div class="trip-text-links" data-trip-travel-links></div>
        </div>

      <div class="trip-meals" data-trip-meals>
        <article class="trip-card">
          <p class="eyebrow">ON THE WAY</p>
          <h3>The Burger House, Satdobato</h3>
          <p>Fried chicken and burgers in Satdobato, before heading south towards Godawari.</p>
          <div class="trip-text-links">
            <a class="page-link" data-trip-stop="The Burger House and Crunchy Fried Chicken, Satdobato, Lalitpur, Nepal" target="_blank" rel="noopener">Route via Satdobato <span class="link-arrow" aria-hidden="true">↗</span></a>
          </div>
        </article>
        <article class="trip-card">
          <p class="eyebrow">AT THE GARDEN</p>
          <h3>Tulip De’ Restaurant</h3>
          <p>At the botanical garden gate, with Nepali dishes and options such as noodles and pizza.</p>
          <div class="trip-text-links">
            <a class="page-link" data-trip-venue="Tulip De Restaurant, H9WJ+Q3C, Godawari, Lalitpur, Nepal" target="_blank" rel="noopener">View gate restaurant on map <span class="link-arrow" aria-hidden="true">↗</span></a>
          </div>
        </article>
        <article class="trip-card">
          <p class="eyebrow">ON THE WAY BACK</p>
          <h3>Harisiddhi Newa Suli</h3>
          <p>Stop for a Newari meal in Harisiddhi if you’re returning via Satdobato.</p>
          <div class="trip-text-links">
            <a class="page-link" data-trip-stop="Harisiddhi Newa Suli, Harisiddhi, Lalitpur, Nepal" data-trip-return target="_blank" rel="noopener">Return via Harisiddhi <span class="link-arrow" aria-hidden="true">↗</span></a>
            <a class="page-link" href="https://noshnepal.com/menu/restaurant/2170" target="_blank" rel="noopener">View menu <span class="link-arrow" aria-hidden="true">↗</span></a>
          </div>
        </article>
      </div>
