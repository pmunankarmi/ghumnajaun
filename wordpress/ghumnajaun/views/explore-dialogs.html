<dialog class="search-dialog start-dialog" id="gj-start-dialog" aria-labelledby="gj-start-title">
  <div class="search-dialog-heading">
    <h2 id="gj-start-title">Change starting point</h2>
    <button class="search-close" id="gj-start-close" type="button" aria-label="Close starting point"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
  </div>
  <form id="gj-start-form" action="explore.html" method="get">
    <label for="gj-start-origin">Starting from</label>

      <option>Kathmandu Valley</option><option>Kathmandu</option><option>Lalitpur</option><option>Bhaktapur</option>
    </select>
    <p>Your current search and filters will stay selected.</p>
    <button class="primary" type="submit">Explore nearby</button>
  </form>
</dialog>
