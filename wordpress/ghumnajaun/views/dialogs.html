<dialog class="search-dialog stop-photo-dialog" id="gj-stop-photo-dialog" aria-labelledby="gj-stop-photo-title">
  <div class="search-dialog-heading">
    <h2 id="gj-stop-photo-title">Stop photo</h2>
    <button class="search-close" id="gj-stop-photo-close" type="button" aria-label="Close photo" autofocus>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
    </button>
  </div>
  <figure>
    <div class="stop-photo-stage">
      <img id="gj-stop-photo-large" alt="" hidden>
      <p id="gj-stop-photo-status" role="status"></p>
    </div>
    <figcaption id="gj-stop-photo-caption"></figcaption>
  </figure>
  <div class="stop-photo-thumbnails" id="gj-stop-photo-thumbnails" role="group" aria-label="Choose a stop photo" hidden></div>
  <div class="stop-photo-controls" id="gj-stop-photo-controls" hidden>
    <button type="button" id="gj-stop-photo-previous" aria-label="Previous stop photo">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 6-6 6 6 6"/></svg>
    </button>
    <span id="gj-stop-photo-position" role="status"></span>
    <button type="button" id="gj-stop-photo-next" aria-label="Next stop photo">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m10 6 6 6-6 6"/></svg>
    </button>
  </div>
</dialog>
